<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#081a15" />
<title>Novo Poker — Three Box Preview</title>
<style>
  :root{
    --bg:#06130f;--felt:#0b4a36;--felt2:#083b2d;--line:rgba(255,255,255,.12);
    --text:#f7f3e8;--muted:#b7c9c1;--gold:#e2b650;--gold2:#ffd978;--danger:#d75c5c;
    --card:#fffefa;--ink:#111418;--shadow:0 12px 28px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:radial-gradient(circle at 50% -20%,#123d31 0,#071711 42%,#030b08 100%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100dvh;overscroll-behavior:none}
  button{font:inherit;color:inherit}
  .app{max-width:720px;margin:0 auto;min-height:var(--view-h,100dvh);padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px}
  .brand{font-weight:900;letter-spacing:.08em;font-size:14px;color:var(--gold2)}
  .bank{display:flex;gap:10px;align-items:center;font-weight:800;font-variant-numeric:tabular-nums}
  .bank small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .bank .value{text-align:right}
  .table{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 45%,#116045 0,#0c4c38 48%,#073526 100%);border:1px solid rgba(255,255,255,.09);border-radius:34px 34px 22px 22px;box-shadow:inset 0 0 60px rgba(0,0,0,.25),var(--shadow);padding:14px 10px 12px;min-height:0}
  .table:before{content:"";position:absolute;inset:10px;border:1px solid rgba(226,182,80,.26);border-radius:27px 27px 17px 17px;pointer-events:none}
  .zone{position:relative;z-index:1;text-align:center}
  .zone-label{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:#d8e3de;font-weight:800;opacity:.9;margin-bottom:5px}
  .dealer{min-height:160px}
  .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);margin:4px 24px 10px}
  .player{min-height:190px}
  .cards{display:flex;justify-content:center;align-items:center;gap:clamp(4px,1.5vw,9px);min-height:118px;padding:8px 2px 13px}
  .card{position:relative;width:clamp(50px,15vw,84px);aspect-ratio:5/7;border:0;background:transparent;padding:0;perspective:900px;transform:translateY(0);transition:transform .18s ease,filter .18s ease;flex:0 1 84px;min-width:0}
  .card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.2,.7,.2,1)}
  .card.face-down .card-inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;box-shadow:0 4px 10px rgba(0,0,0,.24);overflow:hidden}
  .front{background:linear-gradient(145deg,#fff,#f2efe7);color:var(--ink);border:1px solid #d8d4ca;display:grid;place-items:center;padding:5px}
  /* Four-colour poker deck: each suit has its own colour. */
  .front.suit-S{color:#111418}
  .front.suit-H{color:#c62828}
  .front.suit-D{color:#1565c0}
  .front.suit-C{color:#218c4f}
  .rank{font-size:clamp(25px,7.5vw,42px);line-height:1;font-weight:950;letter-spacing:-.04em}
  .suit-corner{position:absolute;top:5px;left:6px;font-size:clamp(15px,4.3vw,23px);line-height:1;font-weight:800}
  .suit-corner.bottom{top:auto;left:auto;right:6px;bottom:5px;transform:rotate(180deg)}
  .back{transform:rotateY(180deg);border:2px solid #e9ddbd;background-color:#16263b;background-image:linear-gradient(45deg,rgba(255,255,255,.07) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.07) 75%),linear-gradient(45deg,rgba(255,255,255,.07) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.07) 75%);background-size:12px 12px;background-position:0 0,6px 6px}
  .card.selectable{cursor:pointer}
  .card.selected{transform:translateY(-12px);filter:drop-shadow(0 0 5px rgba(255,217,120,.85))}
  .card.selected .face{outline:3px solid var(--gold2);outline-offset:1px}
  .card.replacing{animation:replaceOut .2s ease-in both}
  .card.replaced-in{animation:replaceIn .28s cubic-bezier(.15,.85,.25,1) both}
  @keyframes replaceOut{to{opacity:0;transform:translateY(34px) rotate(8deg) scale(.92)}}
  @keyframes replaceIn{from{opacity:0;transform:translate(36px,-58px) rotate(-7deg) scale(.82)}to{opacity:1;transform:none}}
  .hand-name{height:24px;font-size:14px;font-weight:900;color:var(--gold2);letter-spacing:.02em}
  .hint{min-height:22px;font-size:12px;color:#d1ded8;margin-top:2px}
  .stakes{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:7px 0 1px;font-size:12px;color:#d9e3de}
  .stake{border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:5px 9px;background:rgba(0,0,0,.12)}
  .stake b{color:#fff}
  .message{margin:10px 2px 0;min-height:49px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:14px;padding:8px 12px;background:rgba(3,13,9,.32);border:1px solid rgba(255,255,255,.08);font-weight:800;font-size:14px}
  .message.win{color:#ffe8a5}.message.loss{color:#ffc2c2}.message.push{color:#dce8e3}
  .panel{margin-top:12px;background:rgba(7,18,14,.78);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
  .setup{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .setup-title{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.12em}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{width:48px;height:48px;border-radius:50%;border:3px dashed rgba(255,255,255,.48);background:#27323d;box-shadow:inset 0 0 0 3px rgba(0,0,0,.18),0 3px 8px rgba(0,0,0,.25);font-size:12px;font-weight:900;cursor:pointer}
  .chip.active{outline:3px solid var(--gold2);outline-offset:2px;color:#fff4c8}
  .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
  .actions.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  .btn{min-height:48px;border:1px solid rgba(255,255,255,.14);border-radius:13px;background:linear-gradient(#284338,#183128);font-weight:900;cursor:pointer;padding:8px 10px;box-shadow:0 4px 10px rgba(0,0,0,.16)}
  .btn.primary{background:linear-gradient(#d9b655,#a97d24);color:#141009;border-color:#f0d37f}
  .btn.danger{background:linear-gradient(#7d3333,#562326)}
  .btn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.3)}
  .btn:active:not(:disabled),.chip:active{transform:translateY(1px)}
  .minirow{display:flex;gap:8px;margin-top:8px}
  .minirow .btn{min-height:40px;font-size:12px;flex:1;background:#15271f}
  details{margin-top:10px;border-top:1px solid rgba(255,255,255,.08);padding-top:8px;color:var(--muted);font-size:12px;line-height:1.5}
  summary{cursor:pointer;color:#e6eee9;font-weight:800}
  .paytable{display:grid;grid-template-columns:1fr auto;gap:3px 16px;margin-top:8px;max-width:320px}
  .paytable b{color:#fff}
  .foot{font-size:10px;color:#7f958b;text-align:center;padding:10px 4px 0;line-height:1.35}
  @media(max-width:390px){
    .app{padding-left:8px;padding-right:8px}
    .table{padding-left:5px;padding-right:5px}
    .card{width:52px}
    .cards{gap:3px}
    .actions.three{grid-template-columns:1fr 1fr}
    .actions.three .wide{grid-column:auto}
  }
  .app.compact-height{padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .app.compact-height .topbar{margin:0 0 5px}
  .app.compact-height .table{padding-top:9px;padding-bottom:8px;border-radius:26px 26px 18px 18px}
  .app.compact-height .table:before{inset:7px;border-radius:21px 21px 13px 13px}
  .app.compact-height .dealer{min-height:130px}
  .app.compact-height .player{min-height:169px}
  .app.compact-height .cards{min-height:87px;padding:3px 2px 6px}
  .app.compact-height .card{width:clamp(46px,14.3vw,76px)}
  .app.compact-height .zone-label{margin-bottom:1px}
  .app.compact-height .divider{margin:1px 24px 5px}
  .app.compact-height .hand-name{height:20px;font-size:13px}
  .app.compact-height .hint{min-height:18px;font-size:11px;margin-top:0}
  .app.compact-height .stakes{gap:6px;margin:4px 0 0;font-size:11px}
  .app.compact-height .stake{padding:4px 7px}
  .app.compact-height .message{margin-top:6px;min-height:39px;padding:6px 9px;font-size:12px}
  .app.compact-height .panel{margin-top:6px;padding:8px;border-radius:15px}
  .app.compact-height .actions{gap:6px;margin-top:6px}
  .app.compact-height .actions.three{grid-template-columns:repeat(2,minmax(0,1fr))}
  .app.compact-height .actions.three .wide{grid-column:auto}
  .app.compact-height .btn{min-height:43px;padding:5px 8px}
  .app.compact-height .minirow{margin-top:5px;gap:6px}
  .app.compact-height .minirow .btn{min-height:34px;font-size:11px}
  .app.compact-height .chip{width:42px;height:42px;font-size:11px}
  .app.compact-height details{margin-top:6px;padding-top:5px;font-size:11px}
  .app.compact-height .foot{padding-top:5px;font-size:9px}
  .app.short-height .brand{font-size:12px}
  .app.short-height .bank{font-size:14px}
  .app.short-height .bank small{font-size:9px}
  .app.short-height .dealer{min-height:116px}
  .app.short-height .player{min-height:156px}
  .app.short-height .cards{min-height:78px;padding:2px 2px 4px}
  .app.short-height .card{width:clamp(43px,13.6vw,68px)}
  .app.short-height .rank{font-size:clamp(22px,6.8vw,36px)}
  .app.short-height .suit-corner{font-size:clamp(13px,3.8vw,20px)}
  .app.short-height .message{min-height:35px;font-size:11px}
  .app.short-height .panel{padding:6px}
  .app.short-height .btn{min-height:39px;font-size:13px}
  .app.short-height .minirow .btn{min-height:31px;font-size:10px}
  .app.short-height details,.app.short-height .foot{display:none}
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

  .app{max-width:540px;padding-bottom:12px}
  .dealer,.app.compact-height .dealer,.app.short-height .dealer{min-height:0}
  .dealer .cards{min-height:0;padding:4px 2px 6px}
  .dealer .card{flex:0 1 48px}
  .dealer .rank{font-size:26px}
  .dealer .hand-name{height:0}
  .table{padding:14px 10px 10px;border-radius:25px}
  .divider{margin:10px 15px}
  .box-stack{position:relative;z-index:1;display:grid;gap:8px}
  .box-row{background:rgba(2,24,17,.38);border:1px solid rgba(255,255,255,.14);border-radius:15px;padding:9px 10px;scroll-margin-bottom:190px}
  .box-row.active{border-color:var(--gold2);box-shadow:inset 0 0 0 1px rgba(255,217,120,.3);background:rgba(226,182,80,.07)}
  .box-header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;letter-spacing:.08em}
  .box-header button{border:0;background:none;padding:4px 0;color:var(--text);font-weight:900;cursor:pointer;min-height:28px}
  .box-status{font-size:10px;color:var(--muted);letter-spacing:.03em}
  .active .box-status{color:var(--gold2)}
  .box-row .cards,.app.compact-height .box-row .cards,.app.short-height .box-row .cards{min-height:0;padding:9px 0 6px;gap:7px}
  .box-row .card,.app.compact-height .box-row .card,.app.short-height .box-row .card{flex:0 1 51px;width:51px}
  .box-row .rank{font-size:28px}
  .box-row .suit-corner{font-size:15px;left:4px;top:4px}
  .box-row .suit-corner.bottom{left:auto;top:auto;right:4px;bottom:4px}
  .box-row .card.selected{transform:translateY(-5px)}
  .box-footer{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:11px}
  .box-footer b{color:var(--gold2);font-size:12px}
  .box-stakes{color:#b7c9c1;font-size:10px}
  .action-dock,.app.compact-height .action-dock,.app.short-height .action-dock{position:sticky;bottom:0;z-index:20;background:#0a1d16f5;backdrop-filter:blur(12px);border-color:#526044;padding:10px 12px calc(10px + env(safe-area-inset-bottom));margin-top:10px;border-radius:18px 18px 0 0}
  .control-heading{display:flex;justify-content:space-between;align-items:center;font-size:11px;gap:8px}
  .control-heading b{color:var(--gold2);letter-spacing:.08em}
  .control-heading span{color:var(--muted)}
  .action-dock .btn,.app.short-height .action-dock .btn{min-height:44px}
  .action-dock .minirow .btn{font-size:11px}
  .message,.app.compact-height .message,.app.short-height .message{min-height:32px;font-size:11px;margin-top:8px;padding:6px}
  .preview-note{text-align:center;color:var(--muted);font-size:10px;margin:8px 0}
  .restart{width:100%;margin-top:8px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="topbar">
    <div class="brand">NOVO POKER</div>
    <div class="bank"><div class="value"><small>Bankroll</small><span id="bankroll">1,000</span></div></div>
  </header>

  <section class="table" aria-label="Novo Poker table">
    <div class="zone dealer">
      <div class="zone-label">Dealer</div>
      <div class="cards" id="dealerCards"></div>
      <div class="hand-name" id="dealerHand"></div>
      <div class="hint" id="dealerHint">Dealer qualifies with A-K or better</div>
    </div>

    <div class="divider"></div>

    <div class="box-stack" id="boxStack"></div>
    <div class="message" id="message" aria-live="polite">Place your Ante.</div>
  </section>


  <section class="panel action-dock" aria-label="Active box controls">
    <div class="control-heading"><b id="controlTitle">BOX 1</b><span id="controlHint">Choose your next move</span></div>
    <div class="actions"><button class="btn danger" id="fold">FOLD</button><button class="btn primary" id="bet">BET 20</button></div>
    <div class="minirow"><button class="btn" id="draw">DRAW SELECTED · 10</button><button class="btn" id="sixth">BUY 6TH · 10</button></div>
    <button class="btn restart" id="restart" hidden>TRY AGAIN</button>
  </section>
  <p class="preview-note">Layout preview · Sample hands · Tap any unfinished box to play it</p>
</main>
<script>
const suits={S:'♠',H:'♥',D:'♦',C:'♣'};
const samples=[['AS','AH','8C','5D','2S'],['KH','QD','JC','10S','9H'],['QC','QS','7D','7H','3C']];
const names=['One Pair','Straight','Two Pair'];
let active=0, bank=970, hands;
const $=id=>document.getElementById(id);
function card(code,down=false,selected=false,index=-1){const suit=code.slice(-1),rank=code.slice(0,-1);return '<button class="card '+(down?'face-down ':'')+(selected?'selected':'')+'" data-card="'+index+'" aria-label="'+rank+' '+suits[suit]+'" type="button"><span class="card-inner"><span class="face front suit-'+suit+'"><span class="suit-corner">'+suits[suit]+'</span><span class="rank">'+rank+'</span><span class="suit-corner bottom">'+suits[suit]+'</span></span><span class="face back"></span></span></button>';}
function render(){
 const done=hands.every(h=>h.status!=='playing');
 $('bankroll').textContent=bank.toLocaleString();
 $('dealerCards').innerHTML=['AD','KC','8H','6S','4D'].map((c,i)=>card(c,!done&&i!==4)).join('');
 $('dealerHint').textContent=done?'Dealer reveals · Ace-King':'One card exposed · A-K to qualify';
 $('boxStack').innerHTML=hands.map((h,i)=>'<section class="box-row '+(active===i&&!done?'active':'')+'" data-box="'+i+'" aria-label="Box '+(i+1)+'"><div class="box-header"><button data-activate="'+i+'" aria-pressed="'+(active===i)+'">BOX '+(i+1)+'</button><span class="box-status">'+(h.status==='playing'?(active===i?'● YOUR MOVE':'AWAITING DECISION'):h.status==='folded'?'FOLDED':done?'WON · +'+(i===1?80:20):'BET PLACED')+'</span></div><div class="cards">'+h.cards.map((c,j)=>card(c,false,h.selected.has(j),j)).join('')+'</div><div class="box-footer"><b>'+names[i]+'</b><span class="box-stakes">Ante 10 · Bet '+(h.status==='bet'?20:'—')+(h.modified?' · Fee 10':'')+'</span></div></section>').join('');
 $('controlTitle').textContent=done?'ROUND COMPLETE':'BOX '+(active+1);
 $('controlHint').textContent=done?'Sample result':hands[active].modified?'Bet or fold':'Tap cards to select';
 ['fold','bet','draw','sixth'].forEach(id=>$(id).disabled=done||hands[active].status!=='playing');
 $('draw').disabled||=hands[active].modified||!hands[active].selected.size;
 $('sixth').disabled||=hands[active].modified;
 $('draw').textContent=hands[active].selected.size?'DRAW '+hands[active].selected.size+' · 10':'DRAW SELECTED · 10';
 $('restart').hidden=!done;
 $('message').textContent=done?'Sample round complete. Try again to explore the layout.':'All three hands stay visible. Dealer reveals after every decision.';
}
function reset(){active=0;bank=970;hands=samples.map(cards=>({cards:[...cards],selected:new Set(),status:'playing',modified:false}));render();}
function finish(status){const h=hands[active];if(h.status!=='playing')return;h.status=status;if(status==='bet')bank-=20;const next=hands.findIndex(h=>h.status==='playing');if(next>=0)active=next;else hands.forEach((h,i)=>{if(h.status==='bet')bank+=30+(i===1?80:20);});render();if(next>=0)document.querySelector('[data-box="'+next+'"]').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'nearest'});}
 $('boxStack').addEventListener('click',e=>{const row=e.target.closest('[data-box]');if(!row)return;const i=Number(row.dataset.box);if(hands[i].status!=='playing')return;const previous=active;active=i;const button=e.target.closest('[data-card]');if(button&&previous===i&&!hands[i].modified){const j=Number(button.dataset.card);hands[i].selected.has(j)?hands[i].selected.delete(j):hands[i].selected.add(j);}render();});
 $('fold').onclick=()=>finish('folded');$('bet').onclick=()=>finish('bet');
 $('draw').onclick=()=>{const h=hands[active];if(h.modified||!h.selected.size)return;const replacements=['2H','3S','4C','5H','6D'];h.selected.forEach(i=>h.cards[i]=replacements[i]);h.selected.clear();h.modified=true;bank-=10;names[active]='Updated sample hand';render();};
 $('sixth').onclick=()=>{const h=hands[active];if(h.modified)return;h.cards.push(['JD','10C','9S'][active]);h.selected.clear();h.modified=true;bank-=10;render();};
 $('restart').onclick=()=>{names.splice(0,3,'One Pair','Straight','Two Pair');reset();};reset();
</script></body></html>
